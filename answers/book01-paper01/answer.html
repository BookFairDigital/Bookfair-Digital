ent("paper-01.pdf").promise;for(let pageNumber=1;pageNumber<=pdf.numPages;pageNumber++){const page=await pdf.getPage(pageNumber);const base=page.getViewport({scale:1});const width=Math.max(280,Math.min(pages.clientWidth,window.innerWidth));const viewport=page.getViewport({scale:width/base.width});const wrap=document.createElement("div");wrap.className="page-wrap";const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d",{alpha:false}),ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.floor(viewport.width*ratio);canvas.height=Math.floor(viewport.height*ratio);canvas.style.width=Math.floor(viewport.width)+"px";canvas.style.height=Math.floor(viewport.height)+"px";wrap.appendChild(canvas);pages.appendChild(wrap);await page.render({canvasContext:ctx,viewport,transform:ratio!==1?[ratio,0,0,ratio,0,0]:null}).promise}loading.style.display="none"}catch(err){console.error(err);loading.style.display="none";error.style.display="flex"}}renderPdf()})();</script></body></html>
