<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BookFair Digital — Paper 05 Answer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#071525;color:#f8fafc;font-family:Arial,sans-serif;overflow:hidden}
header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#071525;border-bottom:1px solid rgba(255,255,255,.08);position:relative;z-index:5}
h1{margin:0;font-size:14px}a{color:#fff;text-decoration:none;padding:9px 13px;border:1px solid rgba(255,255,255,.13);border-radius:9px;font-size:11px;font-weight:800}
.viewer{position:absolute;top:64px;right:0;bottom:0;left:0;background:#202020}
iframe{width:100%;height:100%;border:0;display:block}
.blocked{display:none;position:fixed;inset:0;z-index:999;align-items:center;justify-content:center;background:#071525;text-align:center;padding:25px}
.box{max-width:420px;padding:30px;border-radius:18px;background:#0d2944;border:1px solid rgba(34,197,94,.25)}
.box h2{margin-top:0}
.box p{color:#aebdcb;line-height:1.6;font-size:13px}
</style>
</head>
<body oncontextmenu="return false">
<header>
<h1>BookFair Digital — Book 01 · Paper 05 Answers</h1>
<a href="../../dashboard.html">← Dashboard</a>
</header>
<main class="viewer">
<iframe src="paper-05.pdf#toolbar=0&navpanes=0&scrollbar=1&view=FitH" title="Paper 05 Model Answers"></iframe>
</main>
<div class="blocked" id="blocked">
<div class="box">
<h2>Access Restricted</h2>
<p>This answer is available only to students assigned to Book 01.</p>
</div>
</div>
<script>
(() => {
  let student = null;
  try { student = JSON.parse(localStorage.getItem("bf_student") || "null"); } catch (_) {}
  const assigned = String(student?.assignedBook || student?.["Assigned Book"] || "").trim().toLowerCase();
  if (!student || assigned !== "book 01") {
    document.querySelector(".viewer").style.display = "none";
    document.getElementById("blocked").style.display = "flex";
  }
  document.addEventListener("copy", e => e.preventDefault(), true);
  document.addEventListener("cut", e => e.preventDefault(), true);
  document.addEventListener("paste", e => e.preventDefault(), true);
  document.addEventListener("selectstart", e => e.preventDefault(), true);
  document.addEventListener("dragstart", e => e.preventDefault(), true);
  document.addEventListener("keydown", e => {
    const k = String(e.key || "").toLowerCase();
    if ((e.ctrlKey || e.metaKey) && ["c","x","s","p","u","a"].includes(k)) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);
})();
</script>
</body>
</html>
