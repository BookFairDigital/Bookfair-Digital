<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>My Books · BookFair Digital</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body.dash {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(50,100,190,.15), transparent 35%),
        radial-gradient(circle at 85% 15%, rgba(190,150,60,.08), transparent 35%),
        #07111f;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .dash-header {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 70px;
      padding: 0 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(7,17,31,.88);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
    }

    .brand-mark {
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #fff;
      color: #07111f;
      font-weight: 900;
    }

    .logout-btn {
      border: 1px solid rgba(255,255,255,.13);
      background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.8);
      padding: 9px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,.1);
      color: #fff;
    }

    .dashboard-main {
      width: min(1180px, 90%);
      margin: auto;
      padding: 70px 0 90px;
    }

    .eyebrow {
      color: rgba(255,255,255,.42);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .16em;
    }

    .dashboard-main h1 {
      margin: 10px 0 8px;
      font-size: clamp(34px, 5vw, 52px);
      line-height: 1.05;
      letter-spacing: -.04em;
    }

    .dashboard-main > p {
      margin: 0 0 42px;
      color: rgba(255,255,255,.55);
      font-size: 14px;
    }

    .student-info {
      margin: 0 0 30px;
      padding: 14px 18px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 14px;
      background: rgba(255,255,255,.035);
      color: rgba(255,255,255,.58);
      font-size: 12px;
    }

    .student-info strong {
      color: #fff;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .book-card {
      position: relative;
      overflow: hidden;
      min-width: 0;
      border-radius: 22px;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.09),
          rgba(255,255,255,.025)
        );
      border: 1px solid rgba(255,255,255,.11);
      box-shadow: 0 25px 70px rgba(0,0,0,.3);
    }

    .book-unlocked {
      transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
    }

    .book-unlocked:hover {
      transform: translateY(-7px);
      border-color: rgba(255,255,255,.25);
      box-shadow: 0 32px 80px rgba(0,0,0,.42);
    }

    .book-cover {
      position: relative;
      aspect-ratio: 1 / 1.28;
      overflow: hidden;
      background: #101a2a;
    }

    .book-cover img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .5s ease;
    }

    .book-unlocked:hover .book-cover img {
      transform: scale(1.035);
    }

    .status {
      position: absolute;
      left: 16px;
      bottom: 16px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(4,10,20,.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.14);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .09em;
    }

    .book-content {
      padding: 22px;
    }

    .book-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
      color: rgba(255,255,255,.4);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .book-content h3 {
      margin: 0 0 9px;
      font-size: 23px;
      line-height: 1.15;
    }

    .book-content p {
      margin: 0 0 20px;
      color: rgba(255,255,255,.53);
      font-size: 13px;
      line-height: 1.6;
    }

    .open-btn,
    .buy-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-radius: 11px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .open-btn {
      background: #fff;
      color: #07111f;
    }

    .open-btn:hover {
      transform: translateY(-2px);
      background: #eef2f6;
    }

    .open-btn span:last-child,
    .buy-btn span:last-child {
      font-size: 18px;
    }

    .locked-card {
      min-height: 520px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 32px;
      background:
        radial-gradient(
          circle at 85% 10%,
          rgba(255,255,255,.06),
          transparent 35%
        ),
        rgba(255,255,255,.025);
    }

    .lock-icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin-bottom: 25px;
      border-radius: 17px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      font-size: 24px;
    }

    .locked-label {
      display: inline-flex;
      width: fit-content;
      padding: 7px 10px;
      margin-bottom: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.48);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .locked-card h3 {
      margin: 0 0 9px;
      font-size: 22px;
    }

    .locked-card p {
      max-width: 250px;
      margin: 0;
      color: rgba(255,255,255,.4);
      font-size: 13px;
      line-height: 1.65;
    }

    .buy-btn {
      margin-top: 25px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.07);
      color: #fff;
    }

    .buy-btn:hover {
      background: rgba(255,255,255,.12);
    }

    .locked-access {
      margin-top: 16px;
      padding-top: 17px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: rgba(255,255,255,.32);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .05em;
    }

    .loading-state {
      grid-column: 1 / -1;
      padding: 50px 20px;
      text-align: center;
      color: rgba(255,255,255,.45);
    }

    @media (max-width: 900px) {
      .book-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .dash-header {
        height: 62px;
        padding: 0 5%;
      }

      .brand span {
        display: none;
      }

      .dashboard-main {
        width: 90%;
        padding: 50px 0 70px;
      }

      .book-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .locked-card {
        min-height: 300px;
      }
    }
  </style>
</head>

<body class="dash">

  <header class="dash-header">

    <a class="brand" href="index.html">
      <span class="brand-mark">B</span>

      <span>
        BookFair Digital
      </span>
    </a>

    <button
      class="logout-btn"
      type="button"
      id="logout"
    >
      Logout
    </button>

  </header>

  <main class="dashboard-main">

    <div class="eyebrow">
      STUDENT PORTAL
    </div>

    <h1>
      My Digital Books
    </h1>

    <p>
      Your assigned digital resources are shown below.
    </p>

    <div class="student-info" id="studentInfo">
      Checking your account…
    </div>

    <div
      class="book-grid"
      id="bookGrid"
    >
      <div class="loading-state">
        Loading your books…
      </div>
    </div>

  </main>

  <script
    type="module"
    src="dashboard.js?v=4"
  ></script>

</body>

</html>
