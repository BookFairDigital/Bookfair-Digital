<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    BookFair Digital — Dashboard
  </title>

  <meta
    name="description"
    content="BookFair Digital student dashboard."
  >

  <link
    rel="stylesheet"
    href="styles.css"
  >


  <style>

    /* =====================================================
       ROOT
    ===================================================== */

    :root {

      --navy:
        #071525;

      --navy-2:
        #0a1d31;

      --blue:
        #0d2944;

      --blue-2:
        #163a5f;

      --green:
        #22c55e;

      --green-light:
        #4ade80;

      --green-dark:
        #16a34a;

      --white:
        #f8fafc;

      --muted:
        #a8b4c3;

      --border:
        rgba(255,255,255,.10);

    }


    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;

      min-height: 100%;

      margin: 0;

      padding: 0;

    }


    body {

      min-height: 100vh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;

      color:
        var(--white);

      background:

        radial-gradient(
          circle at 10% 10%,
          rgba(34,197,94,.10),
          transparent 28%
        ),

        radial-gradient(
          circle at 90% 85%,
          rgba(22,163,74,.08),
          transparent 30%
        ),

        linear-gradient(
          135deg,
          var(--navy),
          var(--blue),
          var(--navy)
        );

      overflow-x:
        hidden;

    }


    /* =====================================================
       BACKGROUND GLOW
    ===================================================== */

    body::before {

      content: "";

      position: fixed;

      width: 430px;

      height: 430px;

      top: -220px;

      right: -170px;

      border-radius: 50%;

      background:
        rgba(34,197,94,.10);

      filter:
        blur(100px);

      pointer-events:
        none;

      animation:
        glowMove 12s ease-in-out infinite alternate;

    }


    body::after {

      content: "";

      position: fixed;

      width: 380px;

      height: 380px;

      left: -200px;

      bottom: -200px;

      border-radius: 50%;

      background:
        rgba(14,165,233,.07);

      filter:
        blur(100px);

      pointer-events:
        none;

    }


    @keyframes glowMove {

      from {
        transform:
          translate3d(0,0,0)
          scale(1);
      }

      to {
        transform:
          translate3d(-40px,40px,0)
          scale(1.12);
      }

    }


    /* =====================================================
       HEADER
    ===================================================== */

    .dash-header {

      width: 100%;

      height: 72px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding:
        0 5.5%;

      position: sticky;

      top: 0;

      z-index: 1000;

      border-bottom:
        1px solid
        rgba(255,255,255,.08);

      background:
        rgba(7,21,37,.90);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

    }


    /* =====================================================
       BRAND
    ===================================================== */

    .brand {

      display: flex;

      align-items: center;

      gap: 11px;

      color:
        var(--white);

      text-decoration:
        none;

    }


    .brand-mark {

      width: 38px;

      height: 38px;

      display: grid;

      place-items: center;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          var(--green),
          var(--green-dark)
        );

      color:
        #ffffff;

      font-size: 16px;

      font-weight: 900;

      box-shadow:
        0 8px 25px
        rgba(34,197,94,.20);

    }


    .brand span:last-child {

      font-size: 14px;

      font-weight: 800;

      letter-spacing:
        -.02em;

    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    .logout-btn {

      min-width: 76px;

      height: 37px;

      padding:
        0 15px;

      border-radius: 10px;

      border:
        1px solid
        rgba(255,255,255,.15);

      background:
        rgba(255,255,255,.045);

      color:
        var(--white);

      font-size: 11px;

      font-weight: 800;

      cursor: pointer;

      transition:
        all .2s ease;

    }


    .logout-btn:hover {

      background:
        rgba(34,197,94,.12);

      border-color:
        rgba(34,197,94,.40);

      color:
        var(--green-light);

      transform:
        translateY(-1px);

    }


    .logout-btn:active {

      transform:
        translateY(0);

    }


    /* =====================================================
       MAIN
    ===================================================== */

    .dashboard-main {

      position: relative;

      z-index: 2;

      width: 90%;

      max-width: 1180px;

      margin:
        0 auto;

      padding:
        65px 0 90px;

    }


    /* =====================================================
       HEADING
    ===================================================== */

    .dashboard-heading {

      margin-bottom:
        38px;

    }


    .dashboard-heading .eyebrow {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin-bottom:
        13px;

      color:
        rgba(255,255,255,.45);

      font-size: 9px;

      font-weight: 850;

      letter-spacing:
        .16em;

    }


    .dashboard-heading .eyebrow::before {

      content: "";

      width: 7px;

      height: 7px;

      border-radius: 50%;

      background:
        var(--green-light);

      box-shadow:
        0 0 12px
        rgba(74,222,128,.60);

    }


    .dashboard-heading h1 {

      margin:
        0 0 10px;

      color:
        var(--white);

      font-size:
        clamp(
          34px,
          5vw,
          52px
        );

      line-height:
        1.04;

      letter-spacing:
        -.045em;

      font-weight:
        850;

    }


    .dashboard-heading p {

      max-width:
        580px;

      margin:
        0;

      color:
        rgba(255,255,255,.48);

      font-size:
        13px;

      line-height:
        1.7;

    }


    /* =====================================================
       STUDENT INFO
    ===================================================== */

    #studentInfo {

      display: inline-flex;

      align-items: center;

      flex-wrap: wrap;

      gap: 5px;

      margin-top:
        18px;

      padding:
        11px 15px;

      border-radius:
        11px;

      border:
        1px solid
        rgba(34,197,94,.16);

      background:
        rgba(34,197,94,.055);

      color:
        rgba(255,255,255,.50);

      font-size:
        10px;

      line-height:
        1.5;

    }


    #studentInfo strong {

      color:
        var(--green-light);

      font-weight:
        800;

    }


    /* =====================================================
       BOOK GRID
    ===================================================== */

    .book-grid {

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0,1fr)
        );

      gap:
        24px;

      align-items:
        stretch;

    }


    /* =====================================================
       BOOK CARD
    ===================================================== */

    .book-card {

      position: relative;

      min-width: 0;

      overflow: hidden;

      border-radius:
        20px;

      border:
        1px solid
        rgba(255,255,255,.10);

      background:
        linear-gradient(
          145deg,
          rgba(13,41,68,.78),
          rgba(7,21,37,.96)
        );

      box-shadow:
        0 25px 70px
        rgba(0,0,0,.30);

      transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;

    }


    /* =====================================================
       COVER
    ===================================================== */

    .book-cover {

      position: relative;

      width: 100%;

      aspect-ratio:
        1 / 1.28;

      overflow: hidden;

      background:
        #101c2c;

    }


    .book-cover img {

      width: 100%;

      height: 100%;

      display: block;

      object-fit: cover;

      transition:
        transform .5s ease;

    }


    /* =====================================================
       UNLOCKED
    ===================================================== */

    .book-unlocked:hover {

      transform:
        translateY(-7px);

      border-color:
        rgba(74,222,128,.32);

      box-shadow:
        0 35px 85px
        rgba(0,0,0,.45);

    }


    .book-unlocked:hover
    .book-cover img {

      transform:
        scale(1.035);

    }


    /* =====================================================
       STATUS
    ===================================================== */

    .status {

      position: absolute;

      left: 16px;

      bottom: 16px;

      display: inline-flex;

      align-items: center;

      gap: 6px;

      padding:
        8px 12px;

      border-radius:
        999px;

      background:
        rgba(4,10,20,.84);

      border:
        1px solid
        rgba(255,255,255,.14);

      backdrop-filter:
        blur(12px);

      color:
        #ffffff;

      font-size:
        9px;

      font-weight:
        850;

      letter-spacing:
        .07em;

    }


    /* =====================================================
       BOOK CONTENT
    ===================================================== */

    .book-content {

      padding:
        22px;

    }


    .book-meta {

      display: flex;

      align-items: center;

      flex-wrap: wrap;

      gap: 7px;

      margin-bottom:
        10px;

      color:
        rgba(255,255,255,.38);

      font-size:
        8px;

      font-weight:
        850;

      letter-spacing:
        .12em;

    }


    .book-content h3,
    .locked-content h3 {

      margin:
        0 0 9px;

      color:
        var(--white);

      font-size:
        22px;

      line-height:
        1.18;

      letter-spacing:
        -.025em;

      font-weight:
        850;

    }


    .book-content p,
    .locked-content p {

      margin:
        0 0 20px;

      color:
        rgba(255,255,255,.50);

      font-size:
        13px;

      line-height:
        1.6;

    }


    /* =====================================================
       BUTTONS
    ===================================================== */

    .open-btn,
    .buy-btn {

      width: 100%;

      min-height:
        49px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      padding:
        0 16px;

      border-radius:
        11px;

      font-size:
        12px;

      font-weight:
        850;

      text-decoration:
        none;

      cursor: pointer;

      transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;

    }


    /* =====================================================
       OPEN BUTTON
    ===================================================== */

    .open-btn {

      border:
        1px solid
        rgba(34,197,94,.65);

      background:
        linear-gradient(
          135deg,
          var(--green),
          var(--green-dark)
        );

      color:
        #ffffff;

      box-shadow:
        0 10px 25px
        rgba(34,197,94,.15);

    }


    .open-btn:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 14px 30px
        rgba(34,197,94,.24);

    }


    .open-btn span:last-child,
    .buy-btn span:last-child {

      font-size:
        18px;

      line-height:
        1;

    }


    /* =====================================================
       LOCKED CARD
    ===================================================== */

    .locked-card {

      background:
        linear-gradient(
          145deg,
          rgba(13,41,68,.52),
          rgba(7,21,37,.96)
        );

    }


    /* =====================================================
       LOCKED COVER
    ===================================================== */

    .locked-card .book-cover img {

      filter:
        brightness(.52)
        saturate(.78);

      transition:
        transform .5s ease,
        filter .3s ease;

    }


    .locked-card:hover
    .book-cover img {

      transform:
        scale(1.025);

      filter:
        brightness(.62)
        saturate(.88);

    }


    .locked-card .book-cover::after {

      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          180deg,
          rgba(3,9,18,.05) 15%,
          rgba(3,9,18,.30) 55%,
          rgba(3,9,18,.78) 100%
        );

      pointer-events:
        none;

    }


    /* =====================================================
       LOCKED CONTENT
    ===================================================== */

    .locked-content {

      padding:
        22px;

    }


    .locked-label {

      display: inline-flex;

      align-items: center;

      width:
        fit-content;

      padding:
        7px 10px;

      margin-bottom:
        11px;

      border-radius:
        999px;

      background:
        rgba(255,255,255,.055);

      border:
        1px solid
        rgba(255,255,255,.08);

      color:
        rgba(255,255,255,.50);

      font-size:
        9px;

      font-weight:
        850;

      letter-spacing:
        .12em;

    }


    /* =====================================================
       BUY BUTTON
    ===================================================== */

    .buy-btn {

      margin-top:
        3px;

      border:
        1px solid
        rgba(255,255,255,.13);

      background:
        rgba(255,255,255,.055);

      color:
        var(--white);

    }


    .buy-btn:hover {

      transform:
        translateY(-2px);

      background:
        rgba(34,197,94,.10);

      border-color:
        rgba(34,197,94,.30);

      color:
        var(--green-light);

    }


    /* =====================================================
       LOCKED ACCESS
    ===================================================== */

    .locked-access {

      margin-top:
        16px;

      padding-top:
        16px;

      border-top:
        1px solid
        rgba(255,255,255,.07);

      color:
        rgba(255,255,255,.28);

      font-size:
        9px;

      font-weight:
        750;

      letter-spacing:
        .07em;

    }


    /* =====================================================
       LOADING
    ===================================================== */

    .loading-state {

      grid-column:
        1 / -1;

      padding:
        60px 20px;

      text-align:
        center;

      color:
        rgba(255,255,255,.42);

      font-size:
        13px;

    }


    /* =====================================================
       FOOTER
    ===================================================== */

    .dashboard-footer {

      position: relative;

      z-index: 2;

      width: 90%;

      max-width: 1180px;

      margin:
        0 auto;

      padding:
        0 0 35px;

      color:
        rgba(255,255,255,.25);

      text-align:
        center;

      font-size:
        10px;

    }


    /* =====================================================
       TABLET
    ===================================================== */

    @media (max-width: 1000px) {

      .dashboard-main {

        width:
          92%;

      }


      .book-grid {

        grid-template-columns:
          repeat(
            2,
            minmax(0,1fr)
          );

      }

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 650px) {

      .dash-header {

        height:
          64px;

        padding:
          0 5%;

      }


      .brand span:last-child {

        font-size:
          12px;

      }


      .brand-mark {

        width:
          34px;

        height:
          34px;

        border-radius:
          9px;

      }


      .logout-btn {

        height:
          34px;

        min-width:
          65px;

        font-size:
          10px;

      }


      .dashboard-main {

        width:
          90%;

        padding:
          45px 0 65px;

      }


      .dashboard-heading {

        margin-bottom:
          28px;

      }


      .dashboard-heading h1 {

        font-size:
          34px;

      }


      .dashboard-heading p {

        font-size:
          12px;

      }


      #studentInfo {

        display:
          block;

        width:
          100%;

        font-size:
          9px;

      }


      .book-grid {

        grid-template-columns:
          1fr;

        gap:
          20px;

      }


      .book-content,
      .locked-content {

        padding:
          20px;

      }


      .book-content h3,
      .locked-content h3 {

        font-size:
          21px;

      }


      .book-content p,
      .locked-content p {

        font-size:
          12px;

      }


      .status {

        left:
          13px;

        bottom:
          13px;

        padding:
          7px 10px;

        font-size:
          8px;

      }


      .dashboard-footer {

        width:
          90%;

        font-size:
          9px;

      }

    }


    /* =====================================================
       SMALL MOBILE
    ===================================================== */

    @media (max-width: 400px) {

      .dashboard-main {

        width:
          92%;

      }


      .dashboard-heading h1 {

        font-size:
          30px;

      }


      .brand span:last-child {

        display:
          none;

      }

    }


    /* =====================================================
       REDUCED MOTION
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation:
          none !important;

        transition:
          none !important;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       HEADER
  ===================================================== -->

  <header class="dash-header">


    <a
      href="index.html"
      class="brand"
      aria-label="BookFair Digital Home"
    >

      <span class="brand-mark">
        B
      </span>

      <span>
        BookFair Digital
      </span>

    </a>


    <button
      class="logout-btn"
      type="button"
      id="logout"
    >
      Logout
    </button>


  </header>



  <!-- =====================================================
       MAIN
  ===================================================== -->

  <main class="dashboard-main">


    <!-- ===================================================
         PAGE HEADING
    =================================================== -->

    <section class="dashboard-heading">


      <div class="eyebrow">
        DIGITAL BOOK ACCESS
      </div>


      <h1>
        Your Digital Books
      </h1>


      <p>
        Access the digital resources connected
        to your physical BookFair books.
      </p>


      <!--
        dashboard.js fills this
        after login.
      -->

      <div id="studentInfo">
        Loading your account...
      </div>


    </section>



    <!-- ===================================================
         BOOK GRID
    =================================================== -->

    <section
      class="book-grid"
      id="bookGrid"
    >


      <div class="loading-state">

        Loading your books...

      </div>


    </section>


  </main>



  <!-- =====================================================
       FOOTER
  ===================================================== -->

  <footer class="dashboard-footer">

    © 2026 BookFair Digital.
    Student Digital Book Platform.

  </footer>



  <!-- =====================================================
       DASHBOARD JAVASCRIPT

       IMPORTANT:
       v=10 forces the browser to load
       the latest dashboard.js.
  ===================================================== -->

  <script
    type="module"
    src="dashboard.js?v=10"
  ></script>


</body>

</html>
