<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Login · BookFair Digital</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body class="auth">

  <div class="auth-bg"></div>

  <form class="box" id="login">

    <a class="auth-brand" href="index.html">
      <b>B</b>
      <span>BookFair Digital</span>
    </a>

    <div class="eyebrow">
      DIGITAL ACCESS
    </div>

    <h1>
      Login
    </h1>

    <p>
      Use the username and password printed on your book sticker.
    </p>

    <label for="u">
      Username
    </label>

    <input
      id="u"
      name="username"
      type="text"
      required
      autocomplete="username"
      placeholder="BF26-00001"
    >

    <label for="p">
      Password
    </label>

    <input
      id="p"
      name="password"
      type="password"
      required
      autocomplete="current-password"
      placeholder="Enter your password"
    >

    <button
      class="btn"
      type="submit"
    >
      Login
      <span>→</span>
    </button>

    <div id="m"></div>

    <div class="registration-note">
      <strong>
        First time logging in?
      </strong>

      <span>
        Registration opens automatically after your first successful login.
      </span>
    </div>

  </form>

  <!-- Firebase login -->
  <script
    type="module"
    src="app.js?v=22">
  </script>

</body>
</html>
