<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login · BookFair Digital</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth">
  <div class="auth-bg"></div>
  <form class="box" id="login">
    <a class="auth-brand" href="index.html"><b>B</b><span>BookFair Digital</span></a>
    <div class="eyebrow">DIGITAL ACCESS</div>
    <h1>Login</h1>
    <p>Use the username and password printed on the sticker attached to your physical book.</p>

    <label>Username</label>
    <input id="u" required autocomplete="username" placeholder="BF26-00125">

    <label>Password</label>
    <input id="p" type="password" required autocomplete="current-password" placeholder="Enter your password">

    <button class="btn" type="submit">Login <span>→</span></button>
    <div id="m"></div>

    <div class="registration-note">
      <strong>First time logging in?</strong>
      <span>After your first login, the registration form will open automatically. Your username will already be filled in and locked.</span>
    </div>
    <a class="back-link" href="index.html">← Back to BookFair Digital</a>
  </form>
  <script src="app.js"></script>
</body>
</html>
